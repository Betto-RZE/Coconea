version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: coconea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coconea_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coconea_password}
      POSTGRES_DB: ${POSTGRES_DB:-coconea_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - coconea_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coconea_user} -d ${POSTGRES_DB:-coconea_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  coconea_pg_data:
    name: coconea_pg_data
